<section class="screen container-narrow create">
  <header class="create-head">
    <h1>Crear publicación</h1>
    <p class="create-sub">La fecha de publicación se asigna automáticamente al guardar.</p>
  </header>

  <form class="card create-card" (submit)="submit($event)" novalidate>
    <div class="field">
      <label for="message">Mensaje</label>
      <textarea
        id="message"
        rows="5"
        [formControl]="message"
        [attr.maxlength]="maxLength"
        placeholder="¿Qué está pasando?"
        [attr.aria-invalid]="showError"
      ></textarea>
      <div class="meta-row">
        @if (showError) {
          <span class="field-error">El mensaje es obligatorio</span>
        } @else {
          <span></span>
        }
        <span class="counter" [class.low]="remaining < 50">{{ remaining }}</span>
      </div>
    </div>

    @if (imagePreview(); as preview) {
      <div class="image-preview">
        <img [src]="preview" alt="Vista previa de la imagen" />
        <button type="button" class="btn-icon remove-image" (click)="clearImage()" aria-label="Quitar imagen">✕</button>
      </div>
    }

    <div class="actions">
      <label class="btn btn-ghost attach">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="2"/>
          <circle cx="8.8" cy="10" r="1.6" fill="currentColor"/>
          <path d="m5 17 4.5-4 3.5 3 3-2.5L21 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        {{ imageFile() ? 'Cambiar foto' : 'Agregar foto' }}
        <input type="file" accept="image/jpeg,image/png,image/webp" (change)="onImageSelected($event)" hidden />
      </label>

      <button
        class="btn btn-primary"
        type="submit"
        [disabled]="store.creating() || message.value.trim().length === 0"
      >
        @if (store.creating()) {
          <span class="spinner" aria-hidden="true"></span>
          Publicando…
        } @else {
          Publicar
        }
      </button>
    </div>
  </form>
</section>
