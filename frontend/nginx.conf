# Serves the Angular SPA and proxies API + WebSocket traffic to the
# microservices, so the browser talks to a single origin (no CORS).

server {
    listen 80;
    server_name _;
    client_max_body_size 3m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets can be cached forever
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # auth-service
    location /auth {
        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /users {
        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # posts-service (REST)
    location /posts {
        proxy_pass http://posts-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # posts-service (WebSocket/STOMP)
    location /ws {
        proxy_pass http://posts-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: Angular router owns every other path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
