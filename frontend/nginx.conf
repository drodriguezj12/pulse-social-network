# Serves the Angular SPA and proxies API + WebSocket traffic to the
# microservices, so the browser talks to a single origin (no CORS).

server {
    listen 80;
    server_name _;
    client_max_body_size 3m;   # the API caps uploads at 2MB; leave room for the envelope
    server_tokens off;         # don't advertise the nginx version

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers, sent on every response ("always" covers error responses too).
    # style-src allows inline styles because Angular injects component styles that way;
    # img-src allows blob: for the local preview shown before an image is uploaded.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Hashed build assets can be cached forever
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # auth-service
    location /auth {
        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /users {
        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # posts-service (REST)
    location /posts {
        proxy_pass http://posts-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # posts-service (WebSocket/STOMP)
    location /ws {
        proxy_pass http://posts-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: Angular router owns every other path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
