name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, posts-service]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` runs unit tests (Surefire) and integration tests (Failsafe).
      # Integration tests spin up a real PostgreSQL 16 with Testcontainers,
      # which works out of the box on GitHub-hosted runners.
      - name: Build and test
        working-directory: backend/${{ matrix.service }}
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:ci

      - name: Production build
        working-directory: frontend
        run: npm run build
